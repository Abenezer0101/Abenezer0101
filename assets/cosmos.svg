<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="A night sky with an aurora and a fairy trailing sparkles">
<defs>
<radialGradient id="sky" cx="50%" cy="10%" r="95%"><stop offset="0%" stop-color="#241a5e"/><stop offset="55%" stop-color="#0d0c2b"/><stop offset="100%" stop-color="#04040e"/></radialGradient>
<linearGradient id="au1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#2de6c0" stop-opacity="0"/><stop offset="40%" stop-color="#2de6c0" stop-opacity=".55"/><stop offset="70%" stop-color="#6d7bff" stop-opacity=".45"/><stop offset="100%" stop-color="#6d7bff" stop-opacity="0"/></linearGradient>
<linearGradient id="au2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#c46bff" stop-opacity="0"/><stop offset="45%" stop-color="#c46bff" stop-opacity=".40"/><stop offset="100%" stop-color="#2de6c0" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-40%" y="-140%" width="180%" height="380%"><feGaussianBlur stdDeviation="13"/></filter>
<filter id="glow" x="-180%" y="-180%" width="460%" height="460%"><feGaussianBlur stdDeviation="3.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<path id="flight" d="M -40 150 C 150 60, 250 210, 420 130 S 660 40, 760 120 S 900 175, 960 110" fill="none"/>
</defs>
<style>
