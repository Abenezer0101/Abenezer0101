@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:1}}
#a1{animation:drift1 19s ease-in-out infinite}
#a2{animation:drift2 25s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scaleY(1)}50%{transform:translate(26px,-9px) scaleY(1.18)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scaleY(1)}50%{transform:translate(-32px,7px) scaleY(.86)}}
.wing{animation:flap .22s ease-in-out infinite;transform-origin:0 0}
@keyframes flap{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(.45) scaleY(1.1)}}
.name{font:700 25px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#f2f0ff;letter-spacing:-.01em}
.tag{font:400 13.5px system-ui,-apple-system,'Segoe UI',sans-serif;fill:#b9b4e8}
@media (prefers-reduced-motion:reduce){.tw,#a1,#a2,.wing{animation:none}}
</style>
