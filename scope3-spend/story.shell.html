<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Carbon Price of a Dollar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Source+Sans+3:wght@400;500;600&display=swap">
<style>
:root{
  --font-anthropic-sans:"Source Sans 3",system-ui,sans-serif;--font-anthropic-serif:"Source Serif 4",Georgia,serif;
  --color-bg:#f7f6f2;--color-panel:#fff;--color-fg:#1f1e1b;--color-fg-muted:#6b6862;--color-border-line:#e3e0d8;--color-bad:#c0392b;
  --cds-text-secondary:#6b6862;--cds-surface-popover:#fff;--cds-border:#dcd8cf;--cds-shadow-popover:0 4px 16px rgb(0 0 0 / .08);
  --cds-chart-grid:#ebe8e1;--cds-chart-reference:#8a867e;--cds-chart-muted:#cfcac0;--cds-chart-status-critical:#c0392b;
  --c1:#2f6f8f;--c2:#d08a3c;
  --cds-gap-sm:8px;--cds-gap-md:16px;--cds-gap-xl:48px;--cds-pad-xs:4px;--cds-pad-sm:8px;--cds-pad-lg:20px;--cds-radius:10px;
  --cds-font-size-caption:12.5px;--cds-font-size-body:16px;--cds-font-size-heading:15px;--cds-font-size-title:24px;--cds-font-weight-medium:500;--cds-dur-slow:.3s;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --color-bg:#161614;--color-panel:#1e1e1b;--color-fg:#ecebe6;--color-fg-muted:#9d9a92;--color-border-line:#33322e;--color-bad:#e5675a;
  --cds-text-secondary:#9d9a92;--cds-surface-popover:#262622;--cds-border:#3a3934;--cds-shadow-popover:0 4px 16px rgb(0 0 0 / .4);
  --cds-chart-grid:#2c2b27;--cds-chart-reference:#8f8b83;--cds-chart-muted:#4a4842;--cds-chart-status-critical:#e5675a;--c1:#6fb3d4;--c2:#e6a75e;color-scheme:dark}}
:root[data-theme="dark"]{
  --color-bg:#161614;--color-panel:#1e1e1b;--color-fg:#ecebe6;--color-fg-muted:#9d9a92;--color-border-line:#33322e;--color-bad:#e5675a;
  --cds-text-secondary:#9d9a92;--cds-surface-popover:#262622;--cds-border:#3a3934;--cds-shadow-popover:0 4px 16px rgb(0 0 0 / .4);
  --cds-chart-grid:#2c2b27;--cds-chart-reference:#8f8b83;--cds-chart-muted:#4a4842;--cds-chart-status-critical:#e5675a;--c1:#6fb3d4;--c2:#e6a75e;color-scheme:dark}
body{margin:0;background:var(--color-bg);color:var(--color-fg);font:16px/1.5 var(--font-anthropic-sans)}
#dash-root{padding-inline:16px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
// Stand-in for the dashboard runtime: the bundled EPA rows are the one dataset, calcs run once in order.
window.dash = (() => {
  const store = {factors: /*ROWS*/}, draws = [];
  addEventListener('resize', () => { clearTimeout(window.__t); window.__t = setTimeout(() => draws.forEach(f => f()), 150); });
  return {
    colors: ['var(--c1)', 'var(--c2)'],
    calc: (id, {inputs, fn}) => { store[id] = fn(...inputs.map(i => store[i])); },
    data: id => ({status: id in store ? 'ok' : 'missing', data: store[id] || []}),
    onData: fn => { draws.push(fn); fn(); },
  };
})();
</script>
</head>
<body>
<div id="dash-root">
/*PAGE*/
</div>
</body>
</html>
