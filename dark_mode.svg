<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="936px" height="417px" font-size="15px" font-family="ConsolasFallback,Consolas,'DejaVu Sans Mono',Menlo,monospace" role="img" aria-label="Abenezer Bekele — profile card">
<style>
@font-face{src:local('Consolas'),local('Consolas Bold');font-family:'ConsolasFallback';font-display:swap;size-adjust:109%;}
.k{fill:#ffa657;} .v{fill:#a5d6ff;} .d{fill:#616e7f;}
.a{fill:#58a6ff;} .ok{fill:#3fb950;}
text,tspan{white-space:pre;}

  .p-blk{fill:#0a0a0c}
  .p-blu{fill:#1a3fd4}
  .p-wht{fill:#fff}

  #p-beast{transform-box:fill-box;transform-origin:50% 78%;animation:lunge 4s cubic-bezier(.3,.7,.4,1) infinite}
  /* a front-facing jaw must DROP, not swing: rotation about a hinge throws
     the chin sideways, which reads as a broken face rather than a roar */
  #p-jaw{animation:chomp 4s cubic-bezier(.3,.7,.4,1) infinite}
  .p-eye{animation:glare 4s ease-in-out infinite}
  #p-throat{animation:gullet 4s cubic-bezier(.3,.7,.4,1) infinite}

  @keyframes lunge{
     0%,30%{transform:scale(1) translate(0,0)}
    36%{transform:scale(.96) translate(0,-8px)}
    43%{transform:scale(1.08) translate(0,4px)}
    46%{transform:scale(1.075) translate(5px,4px)}
    49%{transform:scale(1.075) translate(-5px,4px)}
    52%{transform:scale(1.065) translate(3px,3px)}
    55%{transform:scale(1.065) translate(-3px,3px)}
    58%{transform:scale(1.05) translate(0,2px)}
    70%{transform:scale(1.02) translate(0,0)}
    78%,100%{transform:scale(1) translate(0,0)}
  }
  @keyframes chomp{
     0%,32%{transform:translateY(0)}
    37%{transform:translateY(-4px)}
    43%{transform:translateY(52px)}
    50%{transform:translateY(44px)}
    56%{transform:translateY(52px)}
    64%{transform:translateY(46px)}
    74%{transform:translateY(12px)}
    80%,100%{transform:translateY(0)}
  }
  @keyframes glare{
     0%,34%{fill:#fff}
    43%,64%{fill:#79e7ff}
    78%,100%{fill:#fff}
  }
  @keyframes gullet{
     0%,36%{opacity:0}
    44%,66%{opacity:1}
    76%,100%{opacity:0}
  }
  @media (prefers-reduced-motion:reduce){
    #p-beast,#p-jaw,.eye,#p-throat{animation:none}
  }

</style>
<rect width="936px" height="417px" fill="#161b22" rx="15"/>
<g transform="translate(24,60) scale(0.7142857142857143)"><g id="p-beast">
